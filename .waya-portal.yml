product: "Ideas Cafe"
system: "Customer Portal"
service_type: ui
lifecycle: production
owner: "Frontend Team"

services:
  - name: ideas-cafe-web
    path: /
    runtime: node
    port: 3000
    framework: Next.js

modules:
  - name: pages
    path: src/pages
    description: "Next.js page routes and SSR entry points"
  - name: components
    path: src/components
    description: "Shared React UI components"
  - name: hooks
    path: src/hooks
    description: "Custom React hooks for data fetching and state"
  - name: styles
    path: src/styles
    description: "Global and component-scoped CSS modules"
  - name: api-routes
    path: src/pages/api
    description: "Next.js API routes acting as BFF layer"

features:
  - id: FT-IC-001
    name: "Landing Page"
    priority: high
    status: active
    screens:
      - "Home"
      - "About"
  - id: FT-IC-002
    name: "User Dashboard"
    priority: high
    status: planned
    screens:
      - "Dashboard"
      - "Profile"
  - id: FT-IC-003
    name: "Account Overview"
    priority: medium
    status: planned
    screens:
      - "Account Summary"

integrations:
  internal:
    - service: waya-erp
      protocol: REST
  third_party: []

security:
  - title: "HTTPS Enforced"
    type: encryption
    severity: high
    status: enforced

fraud_rules: []

flows:
  - name: "User Login"
    steps:
      - "User opens ideas-cafe-web"
      - "ideas-cafe-web redirects to Entra SSO"
      - "Entra returns token to ideas-cafe-web"
      - "ideas-cafe-web calls waya-erp /auth/verify"
      - "waya-erp returns session"
  - name: "View Account"
    steps:
      - "User clicks Account on ideas-cafe-web"
      - "ideas-cafe-web calls waya-erp /api/accounts"
      - "waya-erp returns account data"
      - "ideas-cafe-web renders Account Summary"

deploy_checklist:
  pre:
    - "Run build"
    - "Verify env vars"
  post:
    - "Smoke test homepage"
    - "Check error rates"
